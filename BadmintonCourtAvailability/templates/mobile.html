<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Court Availability</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #222;
            --border: #2e2e2e;
            --accent: #c8f542;
            --accent-dim: rgba(200, 245, 66, 0.12);
            --red: #ff5c5c;
            --red-dim: rgba(255, 92, 92, 0.12);
            --text: #f0f0f0;
            --muted: #666;
            --today-border: var(--accent);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ── Header ── */
        .header {
            padding: 28px 20px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-left h1 {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1;
            color: var(--text);
        }

        .header-left .subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .refresh-btn {
            background: var(--accent);
            color: #0f0f0f;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.15s;
            white-space: nowrap;
        }

        .refresh-btn:active { transform: scale(0.96); opacity: 0.85; }
        .refresh-btn.loading { opacity: 0.5; pointer-events: none; }

        /* ── Status bar ── */
        .status-bar {
            padding: 10px 20px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.04em;
            min-height: 36px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .status-dot.ok { background: var(--accent); }
        .status-dot.err { background: var(--red); }
        .status-dot.spin {
            background: var(--accent);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* ── Court tabs ── */
        .court-tabs {
            display: flex;
            padding: 0 20px;
            gap: 8px;
            margin-bottom: 16px;
        }

        .court-tab {
            flex: 1;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .court-tab.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Week grid ── */
        .week-grid {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
            animation: slideIn 0.3s ease both;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .day-card.today {
            border-color: var(--accent);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }

        .day-label {
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .today-badge {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            background: var(--accent);
            color: #0f0f0f;
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .day-summary {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .day-summary .count-badge {
            background: var(--red-dim);
            color: var(--red);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 11px;
        }

        .day-summary .count-badge.clear {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .chevron {
            font-size: 11px;
            color: var(--muted);
            transition: transform 0.2s;
            margin-left: 8px;
        }

        .day-card.collapsed .chevron { transform: rotate(-90deg); }

        /* ── Slots ── */
        .slots-list {
            padding: 4px 0;
            transition: max-height 0.25s ease;
            overflow: hidden;
        }

        .day-card.collapsed .slots-list {
            max-height: 0 !important;
            padding: 0;
        }

        .slot-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .slot-item:last-child { border-bottom: none; }

        .slot-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
            flex-shrink: 0;
        }

        .slot-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.4;
        }

        .slot-text .slot-title {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .no-slots {
            padding: 14px 16px;
            font-size: 12px;
            color: var(--accent);
        }

        /* ── Error / Empty states ── */
        .error-card {
            margin: 0 20px;
            background: var(--red-dim);
            border: 1px solid var(--red);
            border-radius: 10px;
            padding: 20px;
            font-size: 13px;
            color: var(--red);
        }

        .empty-state {
            padding: 80px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .empty-state .big {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>🏸 Court Availability</h1>
        <div class="subtitle">Pitt Recreation &amp; Wellness Center</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">Refresh</button>
</div>

<div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Ready</span>
</div>

<div class="court-tabs" id="courtTabs" style="display:none"></div>

<div id="results">
    <div class="empty-state">
        <span class="big">🏸</span>
        Loading availability...
    </div>
</div>

<script>
    // ── State ──
    let allData = null;        // full API response
    let activeCourtIdx = 0;   // which court tab is selected
    let dataLoaded = false;

    // ── Status helpers ──
    function setStatus(text, mode = '') {
        document.getElementById('statusText').textContent = text;
        const dot = document.getElementById('statusDot');
        dot.className = 'status-dot' + (mode ? ' ' + mode : '');
    }

    // ── Court tabs ──
    function renderCourtTabs(courts) {
        const tabsEl = document.getElementById('courtTabs');
        if (courts.length <= 1) { tabsEl.style.display = 'none'; return; }
        tabsEl.style.display = 'flex';
        tabsEl.innerHTML = courts.map((c, i) => `
            <div class="court-tab ${i === activeCourtIdx ? 'active' : ''}"
                 onclick="selectCourt(${i})">${c.website}</div>
        `).join('');
    }

    function selectCourt(idx) {
        activeCourtIdx = idx;
        renderCourtTabs(allData.data);
        renderWeek(allData.data[idx]);
    }

    // ── Week renderer ──
    function renderWeek(courtData) {
        const resultsEl = document.getElementById('results');

        if (courtData.status === 'error') {
            resultsEl.innerHTML = `<div class="error-card">Error: ${courtData.message}</div>`;
            return;
        }

        const days = courtData.days || [];
        if (!days.length) {
            resultsEl.innerHTML = `<div class="error-card">No data returned.</div>`;
            return;
        }

        resultsEl.innerHTML = `<div class="week-grid">${days.map((day, i) => renderDay(day, i)).join('')}</div>`;

        // Scroll today into view after render
        const todayEl = document.querySelector('.day-card.today');
        if (todayEl) todayEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderDay(day, animIdx) {
        const isToday = day.is_today;
        const slots   = day.slots || [];
        const hasSlots = slots.length > 0;

        // Parse slots into time + title parts
        const slotItems = slots.map(slot => {
            // Format: "1:00 PM to 3:00 PM (Club Badminton)"
            const match = slot.name.match(/^(.+?)\s+\((.+)\)$/);
            const time  = match ? match[1] : slot.name;
            const title = match ? match[2] : '';
            return { time, title };
        });

        const summaryHtml = hasSlots
            ? `<span class="count-badge">${slots.length} reserved</span>`
            : `<span class="count-badge clear">Open</span>`;

        const slotsHtml = hasSlots
            ? slotItems.map(s => `
                <div class="slot-item">
                    <div class="slot-indicator"></div>
                    <div class="slot-text">
                        ${s.time}
                        ${s.title ? `<div class="slot-title">${s.title}</div>` : ''}
                    </div>
                </div>`).join('')
            : `<div class="no-slots">No reservations — court is open all day</div>`;

        // Collapse non-today days that have no reservations by default
        const collapsed = !isToday && !hasSlots ? 'collapsed' : '';

        return `
            <div class="day-card ${isToday ? 'today' : ''} ${collapsed}"
                 style="animation-delay: ${animIdx * 40}ms"
                 id="day-${day.date}">
                <div class="day-header" onclick="toggleDay('day-${day.date}')">
                    <div class="day-label">
                        ${day.label}
                        ${isToday ? '<span class="today-badge">Today</span>' : ''}
                    </div>
                    <div class="day-summary">
                        ${summaryHtml}
                        <span class="chevron">▾</span>
                    </div>
                </div>
                <div class="slots-list" style="max-height: ${hasSlots ? slots.length * 70 + 20 : 50}px">
                    ${slotsHtml}
                </div>
            </div>`;
    }

    function toggleDay(id) {
        const card = document.getElementById(id);
        card.classList.toggle('collapsed');
    }

    // ── Main fetch ──
    async function refreshData() {
        const btn = document.getElementById('refreshBtn');
        btn.classList.add('loading');
        btn.textContent = 'Loading...';
        setStatus('Fetching availability...', 'spin');

        try {
            const resp = await fetch('/api/availability');
            const text = await resp.text();
            if (!text.trim()) throw new Error('Empty response');
            const data = JSON.parse(text);

            if (!data.success) {
                if (data.building) {
                    setStatus('Building cache — try again in a few seconds', 'spin');
                    setTimeout(refreshData, 4000);
                    return;
                }
                throw new Error(data.error || 'Unknown error');
            }

            allData = data;
            renderCourtTabs(data.data);
            renderWeek(data.data[activeCourtIdx]);

            const ts = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            setStatus(`Updated at ${ts}`, 'ok');
            dataLoaded = true;

        } catch (err) {
            setStatus('Error: ' + err.message, 'err');
            document.getElementById('results').innerHTML =
                `<div class="error-card">Failed to load: ${err.message}</div>`;
        } finally {
            btn.classList.remove('loading');
            btn.textContent = 'Refresh';
        }
    }

    // ── Auto-load & auto-refresh ──
    window.addEventListener('load', refreshData);
    setInterval(() => { if (!document.hidden && dataLoaded) refreshData(); }, 30000);

    // ── Shutdown on tab close (local only) ──
    const isCloud = !window.location.hostname.match(/^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/);
    if (!isCloud) {
        let sent = false;
        const doShutdown = () => { if (!sent) { sent = true; navigator.sendBeacon('/api/shutdown', ''); } };
        window.addEventListener('beforeunload', doShutdown);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) setTimeout(() => { if (document.hidden) doShutdown(); }, 10000);
        });
    }
</script>
</body>
</html>
